    :root {
      --paper: #e8dcc4;
      --paper-dark: #d4c4a8;
      --ink: #2a2218;
      --muted: #6b5e4e;
      --wood: #5c3d24;
      --wood-dark: #3a2414;
      --brass: #b08a4a;
      --brass-light: #d4b36a;
      --mustard: #b39a58;
      --sage: #7a8474;
      --terra: #a87458;
      --cobalt: #4a6178;
      --ivory: #f3ead6;
      --gold: #8a6a32;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      height: 100%; overflow: hidden; background: #c4b496; color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 8px);
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(255,255,255,.25), transparent 50%),
        repeating-linear-gradient(0deg, rgba(90,70,40,.03) 0 1px, transparent 1px 3px),
        linear-gradient(165deg, #d7c9ab 0%, #c4b496 55%, #b7a584 100%);
    }
    .calculator {
      width: 100%; max-width: 390px;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,255,255,.35), transparent 40%),
        repeating-linear-gradient(0deg, rgba(90,70,40,.04) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(90,70,40,.025) 0 1px, transparent 1px 4px),
        #ead9b8;
      border-radius: 22px; padding: 16px 14px 18px; position: relative;
      border: 1px solid #cbb892;
      box-shadow:
        0 16px 36px rgba(70,50,20,.22),
        inset 0 1px 0 rgba(255,255,255,.55);
    }
    .corner-bl, .corner-br { display: none; }
    .brand {
      text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .22em;
      color: var(--ink); text-transform: uppercase; margin: 4px 0 12px; opacity: .9;
    }
    .display {
      position: relative;
      background: linear-gradient(180deg, #1a1814 0%, #0c0b09 100%);
      border-radius: 8px; padding: 12px 14px 12px; margin-bottom: 12px; min-height: 158px;
      display: flex; flex-direction: column; justify-content: flex-end;
      box-shadow: inset 0 3px 8px rgba(0,0,0,.55), 0 0 0 2px #8a7348;
      cursor: pointer; user-select: none; -webkit-user-select: none;
      overflow: hidden;
    }
    .tape, .expression {
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      text-align: right;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: none;
    }
    .tape::-webkit-scrollbar, .expression::-webkit-scrollbar { display: none; }
    .tape-inner, .expression-inner {
      display: inline-block;
      min-width: 100%;
      text-align: right;
      white-space: nowrap;
    }
    .tape {
      min-height: 22px; max-height: 26px;
      font-size: 13px; color: #9a8b72; line-height: 1.55;
      font-family: 'Kaktovik', ui-monospace, monospace;
      padding-top: 4px;
    }
    .expression {
      font-size: 14px; color: var(--muted); min-height: 24px;
      font-family: 'Kaktovik', monospace; margin: 4px 0 4px; line-height: 1.55;
      padding-top: 3px;
    }
    .expression .op, .tape .op {
      font-family: Palatino, "Times New Roman", serif;
      color: #d4b36a;
      margin: 0 3px;
      display: inline-block;
      transform: translateY(0.45em);
      position: relative;
    }
    .main-display {
      font-size: 36px; font-weight: 500; text-align: right;
      font-family: 'Kaktovik', monospace; line-height: 1.45; letter-spacing: .04em;
      color: #f3ead6; white-space: nowrap; overflow: hidden; padding-top: 6px;
    }
    .sci-e {
      font-family: Palatino, "Times New Roman", serif;
      font-weight: 600;
      font-size: 0.78em;
      display: inline-block;
      transform: translateY(0.48em);
      letter-spacing: 0;
      margin: 0 1px;
    }
    .calculator.arabic .sci-e { transform: none; font-size: 0.9em; }
    .readouts { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 4px; }
    .mem-flag {
      position: absolute; top: 8px; left: 12px; z-index: 2;
      font-size: 11px; font-weight: 800; color: #d4b36a; letter-spacing: .08em; opacity: 0;
    }
    .mem-flag.on { opacity: 1; }
    .angle-flag {
      margin-right: auto; font-size: 11px; font-weight: 800; color: #d4b36a;
      letter-spacing: .08em; padding: 2px 4px; border-radius: 4px;
    }
    .ascii12 { font-size: 12px; color: #d4b36a; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .decimal-eq { font-size: 12px; color: var(--muted); display: none; }
    .calculator.arabic .decimal-eq { display: inline; }
    .mode {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin: 0 0 10px;
      background: #d8c9ad; border-radius: 8px; padding: 3px; border: 1px solid #b09a74;
    }
    .mode button {
      height: 32px; border: 0; border-radius: 6px; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em;
      font-family: Palatino, "Times New Roman", serif;
    }
    .mode button.on {
      background: linear-gradient(160deg, #3a2a16, #2a1c10);
      color: #f3ead6;
    }
    .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fun-row, .bot-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .numpad {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .num-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .calculator.adv .fun-row,
    .calculator.adv .bot-row,
    .calculator.adv .num-row {
      grid-template-columns: 1fr 1fr 1fr 0.92fr 0.92fr 0.92fr;
    }
    .calculator.flip:not(.adv) .num-row,
    .calculator.flip:not(.adv) .bot-row {
      grid-template-columns: 1.1fr 1fr 1fr 1fr;
    }
    .calculator.flip.adv .fun-row,
    .calculator.flip.adv .num-row,
    .calculator.flip.adv .bot-row {
      grid-template-columns: 0.92fr 0.92fr 0.92fr 1fr 1fr 1fr;
    }
    .calculator.flip .num-row .sci-op { order: 1; }
    .calculator.flip .num-row .op:not(.side-op):not(.sci-op) { order: 2; }
    .calculator.flip .num-row .side-op { order: 3; }
    .calculator.flip .num-row .digit { order: 4; }
    .calculator.flip.adv .fun-row [data-action="mem"] { order: 1; }
    .calculator.flip.adv .fun-row [data-action="msub"] { order: 2; }
    .calculator.flip.adv .fun-row [data-action="mr"] { order: 3; }
    .calculator.flip.adv .fun-row [data-action="lparen"] { order: 4; }
    .calculator.flip.adv .fun-row [data-action="rparen"] { order: 5; }
    .calculator.flip.adv .fun-row [data-action="inv"] { order: 6; }
    .calculator.flip .bot-row .equals { order: 1; }
    .calculator.flip .bot-row [data-action="backspace"] { order: 2; }
    .calculator.flip .bot-row [data-action="sign"] { order: 3; }
    .calculator.flip .bot-row [data-action="dot"] { order: 4; }
    .mem-extra { display: none; }
    .calculator.adv .mem-extra { display: flex; }
    .calculator.adv .equals { grid-column: span 3; }
    .side-op, .sci-op { display: none; }
    .calculator.adv .side-op,
    .calculator.adv .sci-op { display: flex; font-size: 16px; }
    .calculator.adv button.op { font-size: 16px; }
    .calculator.adv button.sci-op.dual .k-main { font-size: 14px; }
    .calculator.adv button.sci-op.dual .k-sub { font-size: 11px; }
    button.dual {
      flex-direction: column; gap: 0; line-height: 1.05; padding: 4px 0;
    }
    button.dual .k-main { font-size: 14px; font-weight: 800; }
    button.dual .k-sub { font-size: 11px; font-weight: 800; opacity: .85; }
    button {
      appearance: none; border: 1px solid #c4ae86; border-radius: 10px; height: 54px;
      background-color: #f6edd8;
      background-image: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 46%);
      box-shadow: 0 3px 0 #c4ae86, 0 5px 8px rgba(80,60,30,.14);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: var(--ink); cursor: pointer;
      user-select: none; -webkit-user-select: none;
      transition: transform .08s;
      font-family: Palatino, "Times New Roman", serif;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c4ae86; }
    button.digit {
      background-color: #f6edd8;
      font-family: 'KaktovikKeys', monospace;
      font-size: 26px; font-weight: 400;
      color: #5c4a32;
      -webkit-text-stroke: 0.45px #f6edd8;
      text-shadow: 0.6px 0.6px 0 #8a7350;
      line-height: 1;
    }
    button.digit .k-digit {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transform: none;
    }
    .calculator.arabic button.digit {
      color: #5c4a32;
      -webkit-text-stroke: 0;
      text-shadow: 0.5px 0.5px 0 #8a7350;
    }
    button.op {
      background-color: var(--mustard);
      color: #2a2218;
      font-family: Palatino, "Times New Roman", serif;
      font-weight: 800;
      font-size: 16px;
    }
    button.op.active { filter: brightness(1.06); }
    button.fn {
      background-color: #f6edd8;
      color: #5c4a32; font-size: 16px; font-weight: 800;
    }
    button.fn.has-mem::after {
      content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%;
      background: var(--terra); top: 8px; right: 10px;
    }
    button.fn { position: relative; }
    button.equals {
      background-color: #f6edd8 !important;
      background-image: linear-gradient(180deg, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 46%) !important;
      color: #2a2218 !important;
      font-weight: 800; font-size: 18px;
      font-family: Palatino, "Times New Roman", serif;
    }
    .c-mustard, .side-op[data-op="+"],
    .calculator.adv #op4, .calculator:not(.adv) #op1, #sciTan {
      background-color: var(--mustard) !important; color: #2a2218 !important;
      border: 1px solid #c4ae86 !important;
      box-shadow: 0 3px 0 #c4ae86, 0 5px 8px rgba(80,60,30,.14) !important;
    }
    .c-sage, .side-op[data-op="−"],
    .calculator.adv #op1, .calculator:not(.adv) #op2 {
      background-color: var(--sage) !important; color: #f3ead6 !important;
      border: 1px solid #c4ae86 !important;
      box-shadow: 0 3px 0 #c4ae86, 0 5px 8px rgba(80,60,30,.14) !important;
    }

</head>
<body>
  <div class="calculator">
    <span class="corner-bl"></span>
    <span class="corner-br"></span>
    <div class="brand">Base-12 · Kaktovik</div>
    <div class="display" id="displayBox">

          <button class="digit" data-bars="B" data-phone="B" data-digit="B"><span class="k-digit">𝋑</span></button>

      <div class="bot-row">

        <button class="equals" data-action="equals">=</button>

  </div>
  <script>
    const KAK = ['𝋀','𝋁','𝋂','𝋅','𝋆','𝋇','𝋊','𝋋','𝋌','𝋏','𝋐','𝋑'];
    const DIGIT_CHARS = '0123456789AB';
    const TAU = 2 * Math.PI;
    const HUNDRED12 = 144;

    let current = '0', previous = null, operator = null, fresh = true, expression = '';
    let advancedOps = false, memory = 0;
    let groupedCurrent = false, powerBaseGrouped = false;
    let tokens = [];
    let justEvaluated = false;
    let lastEqualsOp = null, lastEqualsRight = null;
    let phonePad = false;
    let rightShown = false;
    let angleDeg = false;
    const tapeLines = [];

    const displayEl = document.getElementById('display');
    const expressionEl = document.getElementById('expression');
    const expressionInnerEl = document.getElementById('expressionInner');
    const decimalEl = document.getElementById('decimal');
    const ascii12El = document.getElementById('ascii12');
    const tapeEl = document.getElementById('tape');
    const tapeInnerEl = document.getElementById('tapeInner');
    const memBtn = document.getElementById('memBtn');
    const opButtons = [
      document.getElementById('op1'),
      document.getElementById('op2'),
      document.getElementById('op3'),
      document.getElementById('op4')
    ];

    function toKaktovik(str) {
      if (str === 'Error') return 'Error';
      return String(str).replace(/[0-9A-B]/g, ch => KAK[DIGIT_CHARS.indexOf(ch)] || ch);
    }
    function toKaktovikHtml(str) {
      const s = toKaktovik(str);
      if (s === 'Error') return s;
      return s.replace(/e-?/g, m => '<span class="sci-e">' + m + '</span>');
    }
    function parseBase12(str) {
      if (!str || str === '-' || str === 'Error') return NaN;
      str = String(str).toUpperCase();
      const neg = str.startsWith('-');
      if (neg) str = str.slice(1);
      if (!str) return NaN;

      const parts = str.split('E');
      if (parts.length > 2) return NaN;
      str = parts[0];
      let exp12 = 0;
      if (parts.length === 2) {
        let es = parts[1];
        let esign = 1;
        if (es.startsWith('-')) { esign = -1; es = es.slice(1); }
        else if (es.startsWith('+')) { es = es.slice(1); }
        if (!es || !/^[0-9AB]+$/.test(es)) return NaN;
        let e = 0;
        for (const ch of es) e = e * 12 + DIGIT_CHARS.indexOf(ch);
        exp12 = esign * e;
      }

      if (!/^(?:[0-9AB]+(?:\.[0-9AB]*)?|\.[0-9AB]+)$/.test(str)) return NaN;
      const [intPart = '0', fracPart = ''] = str.split('.');
      let val = 0;
      for (const ch of intPart || '0') val = val * 12 + DIGIT_CHARS.indexOf(ch);
      let place = 1 / 12;
      for (const ch of fracPart) {
        val += DIGIT_CHARS.indexOf(ch) * place;
        place /= 12;
      }
      if (exp12) val *= Math.pow(12, exp12);
      return neg ? -val : val;
    }
    function toBase12Plain(num, maxFrac) {
      const neg = num < 0;
      num = Math.abs(num);
      let intPart = Math.floor(num + 1e-12);
      let frac = num - intPart;
      let intStr = '';
      if (intPart === 0) intStr = '0';
      else {
        while (intPart > 0) {
          intStr = DIGIT_CHARS[intPart % 12] + intStr;
          intPart = Math.floor(intPart / 12);
        }
      }
      let fracStr = '';
      if (frac > 1e-12) {
        fracStr = '.';
        for (let i = 0; i < maxFrac && frac > 1e-12; i++) {
          frac *= 12;
          const digit = Math.min(11, Math.floor(frac + 1e-12));
          fracStr += DIGIT_CHARS[digit];
          frac -= digit;
        }
        fracStr = fracStr.replace(/0+$/, '');
        if (fracStr === '.') fracStr = '';
      }
      return (neg ? '-' : '') + intStr + fracStr;
    }
    function toBase12(num, maxFrac = 6) {
      if (!isFinite(num)) return 'Error';
      num = snapDozenal(num);
      if (Math.abs(num) < 1e-15) return '0';
      const MAX_DIGITS = 10;
      const abs = Math.abs(num);
      const exp10 = Math.log(abs) / Math.log(12);
      const exp = Math.floor(exp10 + 1e-12);
      if (exp >= MAX_DIGITS || exp <= -MAX_DIGITS) {
        const mant = abs / Math.pow(12, exp);
        let mStr = toBase12Plain(mant, 4).replace(/^-/, '');
        if (mStr.indexOf('.') === -1 && mStr.length > 1) {
          mStr = mStr[0] + '.' + mStr.slice(1);
        }
        let eAbs = Math.abs(exp);
        let eStr = '';
        if (eAbs === 0) eStr = '0';
        else {
          while (eAbs > 0) {
            eStr = DIGIT_CHARS[eAbs % 12] + eStr;
            eAbs = Math.floor(eAbs / 12);
          }
        }
        return (num < 0 ? '-' : '') + mStr + 'e' + (exp < 0 ? '-' : '') + eStr;
      }
      return toBase12Plain(num, maxFrac);
    }
    function snapDozenal(num) {
      if (!isFinite(num) || num === 0) return num;
      const sign = num < 0 ? -1 : 1;
      const a = Math.abs(num);
      const tryDen = [12, 144, 1728];
      for (const den of tryDen) {
        const n = Math.round(a * den);
        if (Math.abs(a - n / den) < 1e-6) return sign * n / den;
      }
      return num;
    }
    function formatResult(num) {
      if (!isFinite(num)) return 'Error';
      num = snapDozenal(num);
      const a = Math.abs(num);
      if (Math.abs(a - Math.PI) < 1e-12 || Math.abs(a - TAU) < 1e-12) return toBase12(num, 8);
      return toBase12(num, 6);
    }
    function formatDecimal(n) {
      if (!isFinite(n)) return 'Error';
      if (Math.abs(n) < 1e-10) return '0';
      if (Math.abs(n) >= 1e12 || (Math.abs(n) < 1e-6 && n !== 0)) {
        return n.toExponential(4).replace('e+', 'e');
      }
      if (Number.isInteger(n) || Math.abs(n - Math.round(n)) < 1e-9) return Math.round(n).toLocaleString('en-US');
      return n.toLocaleString('en-US', { maximumFractionDigits: 6 });
    }
    function opSymbol(op) {
      if (op === 'sqrt') return '√';
      if (op === '%') return 'mod';
      return op;
    }
    function scrollLineEnd(scroller) {
      if (!scroller) return;
      requestAnimationFrame(() => { scroller.scrollLeft = scroller.scrollWidth; });
    }
    function pushTape(html) {
      if (!html) return;
      tapeLines.push(html);
      if (tapeLines.length > 6) tapeLines.shift();
      tapeInnerEl.innerHTML = tapeLines[tapeLines.length - 1];
      scrollLineEnd(tapeEl);
    }
    function updateDisplay() {
      const text = toKaktovik(current);
      if (/e[+\-]?[0-9A-B]+$/i.test(current)) {
        displayEl.innerHTML = toKaktovikHtml(current);
      } else {
        displayEl.textContent = text;
      }
      const len = text.length;
      let size = 40;
      if (len > 8) size = 32;
      if (len > 11) size = 28;
      if (len > 13) size = 24;
      if (len > 15) size = 20;
      displayEl.style.fontSize = size + 'px';
      ascii12El.innerHTML = current + '<sub>12</sub>';
      decimalEl.innerHTML = '<span class="op">=</span> ' + formatDecimal(parseBase12(current)) + '<sub>10</sub>';
      expressionInnerEl.innerHTML = expression || renderTokens();
      scrollLineEnd(expressionEl);
      const ang = document.getElementById('angleFlag');
      if (ang) ang.textContent = angleDeg ? 'TURN₁₂' : 'RAD';
      document.querySelector('.calculator').classList.toggle('arabic', phonePad);
      memBtn.classList.toggle('has-mem', memory !== 0);
      const flag = document.getElementById('memFlag');
      if (flag) flag.classList.toggle('on', memory !== 0);
    }
    function fnLabel(fn) {
      if (fn === 'inv') return '1/x';
      if (fn === 'log12') return 'log₁₂';
      if (fn === 'sqrt') return '√';
      if (fn === 'exp') return 'eˣ';
      return fn;
    }
    function tokenGlyph(tok) {
      if (isFnTok(tok) || '+−×÷^%()'.indexOf(tok) !== -1 || tok === 'τ' || tok === 'π' || tok === 'e' || tok === '-τ' || tok === '-π' || tok === '-e' || tok === '√') {
        if (tok === '%') return '<span class="op">mod</span>';
        if ('+−×÷^'.indexOf(tok) !== -1) return '<span class="op">' + tok + '</span>';
        if (tok === '(' || tok === ')') return '<span class="op">' + tok + '</span>';
        if (tok === '-π' || tok === '-τ' || tok === '-e') return '<span class="op">−' + tok.slice(1) + '</span>';
        if (isFnTok(tok) || tok === 'τ' || tok === 'π' || tok === 'e' || tok === '√') return '<span class="op">' + fnLabel(tok) + '</span>';
        return tok;
      }
      return toKaktovik(tok);
    }
    function renderTokens() {
      const parts = tokens.map(tokenGlyph);
      if (isOpTok(lastTok()) && rightShown && current && current !== '') parts.push(toKaktovik(current));
      else if (!fresh && current && current !== '') parts.push(toKaktovik(current));
      else if (tokens.length === 0) parts.push(toKaktovik(current));
      return parts.join(' ');
    }
    function isErrorState() { return current === 'Error'; }
    function clearErrorState() {
      current = '0';
      previous = null;
      operator = null;
      expression = '';
      fresh = true;
      tokens = [];
      justEvaluated = false;
      rightShown = false;
      groupedCurrent = false;
      document.querySelectorAll('button.op').forEach(b => b.classList.remove('active'));
    }
    function flushNumber() {
      if (!fresh && current !== '' && current !== 'Error') {
        implicitMul();
        tokens.push(current);
        fresh = true;
      }
    }
    function lastTok() { return tokens.length ? tokens[tokens.length - 1] : ''; }
    function isOpTok(t) { return t === '+' || t === '−' || t === '×' || t === '÷' || t === '^' || t === '%'; }
    function isFnTok(t) {
      return t === 'sin' || t === 'cos' || t === 'tan' || t === 'asin' || t === 'acos' ||
        t === 'log12' || t === 'ln' || t === '√' || t === 'sqrt' || t === 'inv' || t === 'exp';
    }
    function isAtomEnd(t) {
      return t === ')' || isConstTok(t) || (!!t && !isOpTok(t) && t !== '(' && !isFnTok(t));
    }
    function parenDepthOf(src) {
      let d = 0;
      for (const t of src) {
        if (t === '(') d++;
        else if (t === ')') {
          d--;
          if (d < 0) return -1;
        }
      }
      return d;
    }
    function findGroupStart(src) {
      let depth = 0;
      for (let i = src.length - 1; i >= 0; i--) {
        if (src[i] === ')') depth++;
        else if (src[i] === '(') {
          depth--;
          if (depth === 0) return i;
        }
      }
      return -1;
    }
    function isConstTok(t) { return t === 'π' || t === 'τ' || t === 'e' || t === '-π' || t === '-τ' || t === '-e'; }
    function constValue(t) {
      if (t === 'π' || t === '-π') return t.charAt(0) === '-' ? -Math.PI : Math.PI;
      if (t === 'e' || t === '-e') return t.charAt(0) === '-' ? -Math.E : Math.E;
      return t.charAt(0) === '-' ? -TAU : TAU;
    }
    function implicitMul() {
      const last = lastTok();
      if (!last || isOpTok(last) || last === '(' || isFnTok(last)) return;
      tokens.push('×');
    }
    function evalFn(fn, val) {
      if (fn === '√' || fn === 'sqrt') return val < 0 ? NaN : Math.sqrt(val);
      if (fn === 'inv') return val === 0 ? NaN : 1 / val;
      if (fn === 'sin') return Math.sin(toRad(val));
      if (fn === 'cos') return Math.cos(toRad(val));
      if (fn === 'tan') {
        const r = toRad(val);
        return Math.abs(Math.cos(r)) < 1e-12 ? NaN : Math.tan(r);
      }
      if (fn === 'asin') return (val < -1 || val > 1) ? NaN : fromRad(Math.asin(val));
      if (fn === 'acos') return (val < -1 || val > 1) ? NaN : fromRad(Math.acos(val));
      if (fn === 'exp') return Math.exp(val);
      if (fn === 'log12') return val <= 0 ? NaN : Math.log(val) / Math.log(12);
      if (fn === 'ln') return val <= 0 ? NaN : Math.log(val);
      return val;
    }
    function parseAtom(src, i) {
      if (i >= src.length) return { v: NaN, g: false, i: i };
      if (src[i] === ')') return { v: NaN, g: false, i: i + 1 };
      if (isFnTok(src[i])) {
        if (i + 1 >= src.length) return { v: NaN, g: true, i: i + 1 };
        const arg = parseAtom(src, i + 1);
        return { v: evalFn(src[i], arg.v), g: true, i: arg.i };
      }
      if (src[i] === '(') {
        let depth = 1, j = i + 1;
        while (j < src.length && depth) {
          if (src[j] === '(') depth++;
          else if (src[j] === ')') depth--;
          j++;
        }
        if (depth !== 0) return { v: NaN, g: true, i: src.length };
        const inner = src.slice(i + 1, j - 1);
        if (!inner.length) return { v: NaN, g: true, i: j };
        return { v: evalExpr(inner), g: true, i: j };
      }
      if (src[i] === 'τ') return { v: TAU, g: true, i: i + 1 };
      if (src[i] === '-τ') return { v: -TAU, g: true, i: i + 1 };
      if (src[i] === 'π') return { v: Math.PI, g: true, i: i + 1 };
      if (src[i] === '-π') return { v: -Math.PI, g: true, i: i + 1 };
      if (src[i] === 'e') return { v: Math.E, g: true, i: i + 1 };
      if (src[i] === '-e') return { v: -Math.E, g: true, i: i + 1 };
      return { v: parseBase12(src[i]), g: false, i: i + 1 };
    }
    function evalExpr(src) {
      if (!src || !src.length) return NaN;
      if (parenDepthOf(src) !== 0) return NaN;
      const list = [];
      let i = 0;
      while (i < src.length) {
        if (isOpTok(src[i])) {
          if (!list.length || isOpTok(list[list.length - 1])) return NaN;
          list.push(src[i]);
          i++;
        } else {
          const atom = parseAtom(src, i);
          if (!isFinite(atom.v) && atom.v !== 0) return NaN;
          if (list.length && typeof list[list.length - 1] === 'object') list.push('×');
          list.push({ v: atom.v, g: atom.g });
          i = atom.i;
        }
      }
      if (!list.length || isOpTok(list[list.length - 1])) return NaN;
      const prec = { '^': 3, '×': 2, '÷': 2, '%': 2, '+': 1, '−': 1 };
      const right = { '^': true };
      const out = [], ops = [];
      for (const t of list) {
        if (typeof t === 'object') out.push(t);
        else {
          while (ops.length) {
            const top = ops[ops.length - 1];
            if ((!right[t] && prec[top] >= prec[t]) || (right[t] && prec[top] > prec[t])) out.push(ops.pop());
            else break;
          }
          ops.push(t);
        }
      }
      while (ops.length) out.push(ops.pop());
      const st = [];
      for (const t of out) {
        if (typeof t === 'object') st.push(t);
        else {
          const b = st.pop(), a = st.pop();
          if (!a || !b) return NaN;
          const old = powerBaseGrouped;
          powerBaseGrouped = !!a.g;
          const v = compute(a.v, t, b.v);
          powerBaseGrouped = old;
          st.push({ v: v, g: false });
        }
      }
      return st.length ? st[0].v : 0;
    }

    function repeatOperationFromTokens(src) {
      if (!src || src.length < 3) return null;
      const prec = { '^': 3, '×': 2, '÷': 2, '%': 2, '+': 1, '−': 1 };
      let depth = 0, root = -1, rootPrec = Infinity;
      for (let i = 0; i < src.length; i++) {
        const t = src[i];
        if (t === '(') { depth++; continue; }
        if (t === ')') { depth--; continue; }
        if (depth !== 0 || !isOpTok(t)) continue;
        const p = prec[t];
        if (p < rootPrec) {
          rootPrec = p; root = i;
        } else if (p === rootPrec) {
          // All binary operators except ^ are left-associative, so the
          // rightmost equal-precedence operator is the root. Powers are
          // right-associative, so keep the leftmost ^.
          if (!(t === '^' && src[root] === '^')) root = i;
        }
      }
      if (root < 0 || root >= src.length - 1) return null;
      const rhs = evalExpr(src.slice(root + 1));
      if (!isFinite(rhs)) return null;
      return { op: src[root], right: rhs };
    }

    function inputDigit(d) {
      if (isErrorState()) clearErrorState();
      groupedCurrent = false;
      if (justEvaluated && !operator && tokens.length === 0) {
        tokens = [];
        expression = '';
        current = '0';
        justEvaluated = false;
        lastEqualsOp = null;
        lastEqualsRight = null;
        fresh = true;
      }

      btn.addEventListener('touchcancel', cancel, { passive: true });

    }
    bindLongPress(document.getElementById('op4'), () => {
      if (advancedOps && document.getElementById('op4').dataset.op === 'tau') insertPi();
    }, 450);
    bindLongPress(document.getElementById('op1'), () => {
      if (advancedOps && document.getElementById('op1').dataset.op === '%') applyPercent();
    }, 450);
    bindLongPress(document.querySelector('[data-action=backspace]'), () => {
      current = '0'; previous = null; operator = null; expression = ''; fresh = true; tokens = []; justEvaluated = false; rightShown = false; groupedCurrent = false;
      if (tapeLines.length > 1) {
        tapeLines.splice(0, tapeLines.length - 1);
        tapeInnerEl.innerHTML = tapeLines[0] || '';
      } else if (tapeLines.length === 1) {
        tapeInnerEl.innerHTML = tapeLines[0];
      } else {
        tapeInnerEl.innerHTML = '';
      }
      document.querySelectorAll('button.op').forEach(b => b.classList.remove('active'));
      updateDisplay();
    }, 500);
    bindLongPress(document.getElementById('sciSin'), () => { if (advancedOps) insertFn('asin'); }, 450);
    bindLongPress(document.getElementById('sciCos'), () => { if (advancedOps) insertFn('acos'); }, 450);
    bindLongPress(document.getElementById('op3'), () => {
      if (advancedOps && document.getElementById('op3').dataset.op === '^') insertFn('exp');
    }, 450);
    bindLongPress(document.getElementById('sciLog'), () => { if (advancedOps) insertFn('ln'); }, 450);
    bindLongPress(memBtn, () => { if (!advancedOps) memoryRecall(); }, 450);
    bindLongPress(document.getElementById('memClearBtn'), () => { if (advancedOps) memoryClear(); }, 450);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    updateDisplay();
  </script>
</body>
</html>
